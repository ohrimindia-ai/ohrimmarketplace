<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ohrimmarketplace - Admin</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f0; color: #1a1a1a; }
a { color: inherit; text-decoration: none; }

.navbar { background: #1a1a1a; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 1.3rem; font-weight: 800; }
.logo span { color: #e67e22; }
.nav-right { display: flex; gap: 16px; align-items: center; }
.nav-right a, .nav-right button { background: none; border: none; color: #aaa; font-size: 0.85rem; cursor: pointer; }
.nav-right a:hover, .nav-right button:hover { color: #fff; }

.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 16px; }
.stat-label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }

.tabs { display: flex; gap: 0; margin-bottom: 24px; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; flex-wrap: wrap; }
.tab { padding: 12px 20px; cursor: pointer; font-size: 0.85rem; color: #888; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab:hover { color: #1a1a1a; }
.tab.active { color: #e67e22; border-bottom-color: #e67e22; font-weight: 600; }

.panel { display: none; }
.panel.active { display: block; }

.filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: #fff; color: #888; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
.filter-btn:hover { border-color: #999; color: #666; }
.filter-btn.active { border-color: #e67e22; background: #fff8f0; color: #e67e22; }

.order-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 16px; margin-bottom: 10px; }
.order-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.order-body { display: flex; gap: 12px; margin-top: 10px; }
.order-img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #f0f0f0; flex-shrink: 0; }
.order-info { flex: 1; }
.order-product { font-weight: 600; }
.order-customer { font-size: 0.8rem; color: #666; margin-top: 2px; }
.order-meta { font-size: 0.75rem; color: #999; margin-top: 4px; }
.order-right { text-align: right; }
.order-amount { font-weight: 700; color: #e67e22; font-size: 1.1rem; }
.order-actions { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; justify-content: flex-end; }

.status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
.status-pending { background: #fff3e0; color: #e67e22; }
.status-confirmed { background: #e8f5e9; color: #4caf50; }
.status-dispatched { background: #e3f2fd; color: #2196f3; }
.status-delivered { background: #e8f5e9; color: #27ae60; }
.status-cancelled { background: #ffebee; color: #e74c3c; }
.status-approved { background: #e8f5e9; color: #27ae60; }
.status-rejected { background: #ffebee; color: #e74c3c; }

.btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; font-size: 0.7rem; font-weight: 500; transition: all 0.2s; }
.btn:hover { border-color: #e67e22; color: #e67e22; }
.btn.btn-green { border-color: #4caf50; color: #4caf50; }
.btn.btn-blue { border-color: #2196f3; color: #2196f3; }
.btn.btn-orange { border-color: #e67e22; color: #e67e22; }
.btn.btn-red { border-color: #e74c3c; color: #e74c3c; }

.add-shop-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.add-shop-card h3 { margin-bottom: 12px; font-size: 1rem; }
.inline-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.inline-form input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.85rem; flex: 1; min-width: 120px; }
.inline-form button { padding: 8px 16px; background: #e67e22; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; white-space: nowrap; }

.shops-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.shop-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 14px; }
.shop-number { font-size: 1.3rem; font-weight: 700; }
.shop-meta { font-size: 0.8rem; color: #888; margin-top: 4px; }

.admin-product { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
.admin-product-img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #f0f0f0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
.admin-product-info { flex: 1; min-width: 0; }
.admin-product-name { font-weight: 600; font-size: 0.9rem; }
.admin-product-meta { font-size: 0.75rem; color: #888; margin-top: 2px; }
.admin-product-cat { display: inline-block; background: #fff8f0; border: 1px solid #f5d9b8; color: #e67e22; border-radius: 4px; padding: 1px 8px; font-size: 0.7rem; font-weight: 600; margin-top: 4px; }
.admin-product-cat.inactive { background: #ffebee; border-color: #f5c6c6; color: #e74c3c; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 16px; width: 90%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; }
.modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; }
.modal h3 { margin-bottom: 16px; font-size: 1rem; }
.modal label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 4px; margin-top: 10px; }
.modal input, .modal select, .modal textarea { width: 100%; padding: 9px 11px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; outline: none; }
.modal textarea { resize: vertical; min-height: 60px; }
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: #e67e22; }
.modal-save { width: 100%; padding: 12px; background: #e67e22; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 16px; }
.modal-save:hover { background: #d35400; }
.modal-check { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.modal-check input { width: auto; }
.modal-check label { margin: 0; }

.empty { text-align: center; padding: 40px; color: #999; }

.toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 0.85rem; z-index: 200; display: none; }
.toast.show { display: block; }
.toast.success { background: #27ae60; }
.toast.error { background: #e74c3c; }

/* Login */
.login-overlay { position: fixed; inset: 0; background: #f5f5f0; z-index: 200; display: flex; align-items: center; justify-content: center; }
.login-card { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.login-card h2 { margin-bottom: 8px; }
.login-card p { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
.login-card input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; outline: none; }
.login-card input:focus { border-color: #e67e22; }
.login-card button { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
.login-card .error { color: #e74c3c; font-size: 0.85rem; margin-top: 8px; display: none; }

@media (max-width: 640px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .order-body { flex-direction: column; }
  .order-right { text-align: left; }
}
</style>
</head>
<body>

<div class="login-overlay" id="loginScreen">
  <div class="login-card">
    <h2>Admin <span style="color:#e67e22">Login</span></h2>
    <p>Enter admin password</p>
    <input type="password" id="loginPass" placeholder="Password">
    <div class="error" id="loginError"></div>
    <button onclick="doLogin()">Login</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="navbar">
    <a href="/" class="logo">ohrim<span>marketplace</span> Admin</a>
    <div class="nav-right">
      <a href="/">View Store</a>
      <button onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('ordersPanel', this)">All Orders</div>
      <div class="tab" onclick="switchTab('productsPanel', this)">Products</div>
      <div class="tab" onclick="switchTab('inquiriesPanel', this)">Inquiries</div>
      <div class="tab" onclick="switchTab('categoriesPanel', this)">Categories</div>
      <div class="tab" onclick="switchTab('shopsPanel', this)">Shops</div>
    </div>

    <div id="ordersPanel" class="panel active">
      <div class="filter-row" id="statusFilters"></div>
      <div id="ordersList"></div>
    </div>

    <div id="productsPanel" class="panel">
      <div class="filter-row" id="categoryFilters"></div>
      <div id="adminProductsList"></div>
    </div>

    <div id="inquiriesPanel" class="panel">
      <div id="inquiriesList"></div>
    </div>

    <div id="categoriesPanel" class="panel">
      <div class="add-shop-card">
        <h3>Add New Category</h3>
        <div class="inline-form">
          <input type="text" id="newCatName" placeholder="Category name">
          <button onclick="addCategory()">Add Category</button>
        </div>
      </div>
      <div id="categoriesList"></div>
    </div>

    <div id="shopsPanel" class="panel">
      <div class="add-shop-card">
        <h3>Add New Shop</h3>
        <div class="inline-form">
          <input type="text" id="newShopNum" placeholder="Shop Number">
          <input type="text" id="newShopPass" placeholder="Password">
          <button onclick="addShop()">Add Shop</button>
        </div>
      </div>
      <div id="shopsList" class="shops-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="editProductModal">
  <div class="modal">
    <button class="modal-close" onclick="closeAdminEdit()">&times;</button>
    <h3>Edit Product</h3>
    <input type="hidden" id="aeditId">
    <label>Product Name</label>
    <input type="text" id="aeditName">
    <label>Price (₹)</label>
    <input type="number" id="aeditPrice" min="1">
    <label>Category</label>
    <select id="aeditCategory"></select>
    <label>Description</label>
    <textarea id="aeditDesc"></textarea>
    <div class="modal-check">
      <input type="checkbox" id="aeditActive" checked>
      <label for="aeditActive">Product active (visible in store)</label>
    </div>
    <button class="modal-save" onclick="saveAdminEdit()">Save Changes</button>
  </div>
</div>

<script>
let allOrders = [];
let statusFilter = '';
let allAdminProducts = [];
let adminCatFilter = '';
let allInquiries = [];

async function doLogin() {
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  if (!pass) { errEl.textContent = 'Enter password'; errEl.style.display = 'block'; return; }
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadAll();
    } else {
      errEl.textContent = data.error;
      errEl.style.display = 'block';
    }
  } catch { errEl.textContent = 'Error'; errEl.style.display = 'block'; }
}

async function doLogout() {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.reload();
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(name).classList.add('active');
  if (name === 'productsPanel') { loadAdminProducts(); renderCategoryFilters(); }
  if (name === 'categoriesPanel') loadAdminCategories();
  if (name === 'inquiriesPanel') loadAdminInquiries();
}

async function loadAll() {
  loadStats();
  loadOrders();
  loadShops();
  loadAdminProducts();
  loadAdminCategories();
  loadAdminInquiries();
  renderStatusFilters();
  renderCategoryFilters();
}

async function loadStats() {
  try {
    const res = await fetch('/api/admin/stats');
    const d = await res.json();
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value">${d.totalOrders}</div></div>
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" style="color:#e67e22">${d.pendingOrders}</div></div>
      <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value" style="color:#27ae60">₹${Number(d.totalRevenue).toLocaleString('en-IN')}</div></div>
      <div class="stat-card"><div class="stat-label">Products</div><div class="stat-value">${d.totalProducts}</div></div>
      <div class="stat-card"><div class="stat-label">Shops</div><div class="stat-value">${d.totalShops}</div></div>
    `;
  } catch { }
}

function renderStatusFilters() {
  const statuses = ['', 'pending', 'confirmed', 'dispatched', 'delivered', 'cancelled'];
  const labels = ['All', 'Pending', 'Confirmed', 'Dispatched', 'Delivered', 'Cancelled'];
  document.getElementById('statusFilters').innerHTML = statuses.map((s, i) =>
    `<button class="filter-btn ${s === statusFilter ? 'active' : ''}" onclick="setStatusFilter('${s}', this)">${labels[i]}</button>`
  ).join('');
}

function setStatusFilter(s, el) {
  statusFilter = s;
  renderStatusFilters();
  renderOrders();
}

async function loadOrders() {
  try {
    const res = await fetch('/api/admin/orders');
    const data = await res.json();
    allOrders = data.orders || [];
    renderOrders();
  } catch { }
}

function renderOrders() {
  let filtered = statusFilter ? allOrders.filter(o => o.status === statusFilter) : allOrders;
  const el = document.getElementById('ordersList');
  if (!filtered.length) { el.innerHTML = '<div class="empty">No orders found</div>'; return; }
  el.innerHTML = filtered.map(o => `
    <div class="order-card">
      <div class="order-header">
        <div>
          <span class="status-badge status-${o.status}">${o.status}</span>
          <span style="font-size:0.75rem;color:#999;margin-left:8px">Order #${o.id}</span>
          <span style="font-size:0.75rem;color:#999;margin-left:8px">Shop #${o.shopNumber}</span>
        </div>
        <span style="font-size:0.75rem;color:#999">${new Date(o.createdAt).toLocaleString()}</span>
      </div>
      <div class="order-body">
        ${o.productImage ? '<img class="order-img" src="' + o.productImage + '">' : '<div class="order-img" style="display:flex;align-items:center;justify-content:center">📦</div>'}
        <div class="order-info">
          <div class="order-product">${esc(o.productName)} × ${o.quantity}</div>
          <div class="order-customer">👤 ${esc(o.customerName)} &nbsp; 📱 ${esc(o.customerPhone)}</div>
          ${o.customerAddress ? '<div class="order-meta">📍 ' + esc(o.customerAddress) + '</div>' : ''}
        </div>
        <div class="order-right">
          <div class="order-amount">₹${Number(o.totalAmount).toLocaleString('en-IN')}</div>
          <div class="order-actions">
            ${o.status === 'pending' ? `
              <button class="btn btn-green" onclick="updateOrder(${o.id}, 'confirmed')">Confirm</button>
              <button class="btn btn-red" onclick="updateOrder(${o.id}, 'cancelled')">Cancel</button>
            ` : ''}
            ${o.status === 'confirmed' ? `<button class="btn btn-blue" onclick="updateOrder(${o.id}, 'dispatched')">Dispatch</button>` : ''}
            ${o.status === 'dispatched' ? `<button class="btn btn-green" onclick="updateOrder(${o.id}, 'delivered')">Delivered</button>` : ''}
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

async function updateOrder(id, status) {
  await fetch('/api/admin/orders/' + id, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  });
  loadOrders();
  loadStats();
  showToast('Order #' + id + ' updated to ' + status, 'success');
}

async function loadAdminInquiries() {
  try {
    const res = await fetch('/api/admin/inquiries');
    const data = await res.json();
    allInquiries = data.inquiries || [];
    renderAdminInquiries();
  } catch { }
}

function renderAdminInquiries() {
  const el = document.getElementById('inquiriesList');
  if (!allInquiries.length) { el.innerHTML = '<div class="empty">No inquiries yet</div>'; return; }
  el.innerHTML = allInquiries.map(q => `
    <div class="order-card">
      <div class="order-header">
        <div>
          <span class="status-badge status-${q.status}">${q.status}</span>
          <span style="font-size:0.75rem;color:#999;margin-left:8px">Inquiry #${q.id}</span>
        </div>
        <span style="font-size:0.75rem;color:#999">${new Date(q.createdAt).toLocaleString()}</span>
      </div>
      <div class="order-body">
        ${q.image ? '<img class="order-img" src="' + esc(q.image) + '">' : '<div class="order-img" style="display:flex;align-items:center;justify-content:center">📦</div>'}
        <div class="order-info">
          <div class="order-product">${esc(q.productName)}</div>
          <div class="order-customer">👤 ${esc(q.buyerName)} &nbsp; 📱 ${esc(q.phone)}</div>
          ${q.city ? '<div class="order-meta">📍 ' + esc(q.city) + '</div>' : ''}
          ${q.quantity ? '<div class="order-meta">Quantity: ' + esc(q.quantity) + '</div>' : ''}
          ${q.estimatedPrice ? '<div class="order-meta">Est. Price: ₹' + esc(q.estimatedPrice) + '</div>' : ''}
          ${q.description ? '<div class="order-meta">' + esc(q.description) + '</div>' : ''}
        </div>
        <div class="order-right">
          <div class="order-actions">
            ${q.status !== 'approved' ? `<button class="btn btn-green" onclick="updateInquiry(${q.id}, 'approved')">Approve</button>` : ''}
            ${q.status !== 'rejected' ? `<button class="btn btn-red" onclick="updateInquiry(${q.id}, 'rejected')">Reject</button>` : ''}
            <button class="btn btn-blue" onclick="deleteInquiry(${q.id})">Delete</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

async function updateInquiry(id, status) {
  try {
    const res = await fetch('/api/admin/inquiries/' + id, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Inquiry #' + id + ' ' + status, 'success');
      loadAdminInquiries();
    } else { showToast(data.error, 'error'); }
  } catch { showToast('Error', 'error'); }
}

async function deleteInquiry(id) {
  if (!confirm('Delete this inquiry?')) return;
  try {
    const res = await fetch('/api/admin/inquiries/' + id, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
      showToast('Inquiry #' + id + ' deleted', 'success');
      loadAdminInquiries();
    } else { showToast(data.error, 'error'); }
  } catch { showToast('Error', 'error'); }
}

async function loadShops() {
  try {
    const res = await fetch('/api/admin/shops');
    const data = await res.json();
    document.getElementById('shopsList').innerHTML = (data.shops || []).map(s => `
      <div class="shop-card">
        <div class="shop-number">Shop #${s.shopNumber}</div>
        <div class="shop-meta">${s.productCount} products</div>
        <div class="shop-meta">ID: ${s.id}</div>
      </div>
    `).join('');
  } catch { }
}

async function addShop() {
  const num = document.getElementById('newShopNum').value;
  const pass = document.getElementById('newShopPass').value;
  if (!num || !pass) { showToast('Enter shop number and password', 'error'); return; }
  try {
    const res = await fetch('/api/admin/shops', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shopNumber: num, password: pass })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Shop #' + num + ' created!', 'success');
      document.getElementById('newShopNum').value = '';
      document.getElementById('newShopPass').value = '';
      loadShops();
      loadStats();
    } else { showToast(data.error, 'error'); }
  } catch { showToast('Error', 'error'); }
}

function renderCategoryFilters() {
  const set = new Set(allAdminProducts.map(p => p.category || 'General').filter(Boolean));
  const cats = ['', ...set];
  document.getElementById('categoryFilters').innerHTML = cats.map(c => {
    const label = c === '' ? 'All' : c;
    return `<button class="filter-btn ${c === adminCatFilter ? 'active' : ''}" onclick="setAdminCatFilter('${esc(c)}', this)">${esc(label)}</button>`;
  }).join('');
}

function setAdminCatFilter(c, el) {
  adminCatFilter = c;
  renderCategoryFilters();
  renderAdminProducts();
}

async function loadAdminProducts() {
  try {
    const res = await fetch('/api/admin/products');
    const data = await res.json();
    allAdminProducts = data.products || [];
    renderAdminProducts();
  } catch { }
}

function renderAdminProducts() {
  let list = adminCatFilter ? allAdminProducts.filter(p => (p.category || 'General') === adminCatFilter) : allAdminProducts;
  const el = document.getElementById('adminProductsList');
  if (!list.length) { el.innerHTML = '<div class="empty">No products found</div>'; return; }
  el.innerHTML = list.map(p => `
    <div class="admin-product">
      ${p.image ? '<img class="admin-product-img" src="' + p.image + '">' : '<div class="admin-product-img">📦</div>'}
      <div class="admin-product-info">
        <div class="admin-product-name">${esc(p.name)}</div>
        <div class="admin-product-meta">₹${Number(p.price).toLocaleString('en-IN')} &nbsp;•&nbsp; Shop #${p.shopNumber}</div>
        <div><span class="admin-product-cat ${p.active ? '' : 'inactive'}">${esc(p.category || 'General')}</span> ${p.active ? '' : '<span class="admin-product-cat inactive">Hidden</span>'}</div>
      </div>
      <button class="btn" onclick="openAdminEdit(${p.id})">Edit</button>
    </div>
  `).join('');
}

let adminCategories = [];

async function loadAdminCategories() {
  try {
    const res = await fetch('/api/admin/categories');
    const data = await res.json();
    adminCategories = data.categories || [];
    renderAdminCategories();
  } catch { }
}

function renderAdminCategories() {
  const el = document.getElementById('categoriesList');
  if (!adminCategories.length) { el.innerHTML = '<div class="empty">No categories yet</div>'; return; }
  el.innerHTML = adminCategories.map(c => `
    <div class="admin-product">
      <div class="admin-product-info">
        <div class="admin-product-name">${esc(c.name)}</div>
        <div class="admin-product-meta">${c.count} active product${c.count === 1 ? '' : 's'}</div>
      </div>
      <input type="text" id="catRename_${c.id}" value="${esc(c.name)}" style="flex:1;min-width:140px;max-width:260px;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:0.85rem">
      <button class="btn btn-orange" onclick="renameCategory(${c.id})">Rename</button>
      <button class="btn btn-red" onclick="deleteCategory(${c.id})">Delete</button>
    </div>
  `).join('');
}

async function addCategory() {
  const name = document.getElementById('newCatName').value.trim();
  if (!name) { showToast('Enter category name', 'error'); return; }
  try {
    const res = await fetch('/api/admin/categories', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Category added!', 'success');
      document.getElementById('newCatName').value = '';
      loadAdminCategories();
    } else { showToast(data.error, 'error'); }
  } catch { showToast('Error', 'error'); }
}

async function renameCategory(id) {
  const name = document.getElementById('catRename_' + id).value.trim();
  if (!name) { showToast('Enter category name', 'error'); return; }
  try {
    const res = await fetch('/api/admin/categories/' + id, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Category renamed!', 'success');
      loadAdminCategories();
      loadAdminProducts();
    } else { showToast(data.error, 'error'); }
  } catch { showToast('Error', 'error'); }
}

async function deleteCategory(id) {
  if (!confirm('Delete this category? Products in it will move to "General".')) return;
  try {
    const res = await fetch('/api/admin/categories/' + id, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
      showToast('Category deleted', 'success');
      loadAdminCategories();
      loadAdminProducts();
    } else { showToast(data.error, 'error'); }
  } catch { showToast('Error', 'error'); }
}

function fillAdminCategorySelect(sel, current) {
  const list = adminCategories.map(c => c.name);
  const opts = current && !list.includes(current) ? [current, ...list] : list;
  sel.innerHTML = opts.map(c =>
    `<option value="${esc(c)}" ${c === current ? 'selected' : ''}>${esc(c)}</option>`
  ).join('');
}

function openAdminEdit(id) {
  const p = allAdminProducts.find(x => x.id === id);
  if (!p) return;
  document.getElementById('aeditId').value = p.id;
  document.getElementById('aeditName').value = p.name;
  document.getElementById('aeditPrice').value = p.price;
  document.getElementById('aeditDesc').value = p.description || '';
  fillAdminCategorySelect(document.getElementById('aeditCategory'), p.category || 'General');
  document.getElementById('aeditActive').checked = !!p.active;
  document.getElementById('editProductModal').classList.add('show');
}

function closeAdminEdit() {
  document.getElementById('editProductModal').classList.remove('show');
}

async function saveAdminEdit() {
  const id = document.getElementById('aeditId').value;
  const name = document.getElementById('aeditName').value;
  const price = document.getElementById('aeditPrice').value;
  if (!name || !price) { showToast('Fill name and price', 'error'); return; }
  try {
    const res = await fetch('/api/admin/products/' + id, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name, price,
        category: document.getElementById('aeditCategory').value,
        description: document.getElementById('aeditDesc').value,
        active: document.getElementById('aeditActive').checked
      })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Product updated!', 'success');
      closeAdminEdit();
      loadAdminProducts();
      loadStats();
    } else { showToast(data.error, 'error'); }
  } catch { showToast('Error', 'error'); }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') doLogin();
  if (e.key === 'Escape') closeAdminEdit();
});
</script>
</body>
</html>
